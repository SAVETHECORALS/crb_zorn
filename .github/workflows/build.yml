name: Build LineageOS 24.0 for Xiaomi zorn

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build Target'
        required: true
        default: 'rom'
        type: choice
        options:
          - 'rom'
          - 'bootimage'
          - 'recoveryimage'
          - 'sepolicy'
      module_name:
        description: 'Module name (only used if target is "module", e.g. libgui_shim)'
        required: false
        default: 'libgui_shim'
        type: string
      clean_cache:
        description: 'Wipe CCache before building'
        required: false
        default: false
        type: boolean
      upload_release:
        description: 'Upload build artifacts to GitHub Releases'
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout Workspace Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Maximize Runner Disk Space
        run: |
          echo "=== Free disk before cleanup ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /var/lib/docker \
            /var/lib/containerd \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /usr/local/graalvm \
            /usr/share/swift \
            /opt/pipx \
            /opt/az \
            /opt/microsoft \
            /usr/share/sbt \
            /usr/local/julia*
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "=== Free disk after cleanup ==="
          df -h /

      - name: Allocate 4GB Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install Build Dependencies & Setup Git
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 jq
          git config --global user.name "SAVETHECORALS"
          git config --global user.email "1pro00013@gmail.com"

      - name: Install Google Repo Tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Restore CCache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-zorn-${{ inputs.target }}-${{ github.run_id }}
          restore-keys: |
            ccache-zorn-${{ inputs.target }}-
            ccache-zorn-

      - name: Configure CCache Environment
        run: |
          mkdir -p /tmp/ccache
          export CCACHE_DIR=/tmp/ccache
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 10G
          if [ "${{ inputs.clean_cache }}" = "true" ]; then
            ccache -C
          fi
          ccache -s

      - name: "Build Boot and Kernel Artifacts"
        if: ${{ inputs.target == 'bootimage' }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          ./scripts/build_boot.sh $GITHUB_WORKSPACE/artifacts

      - name: Initialize LineageOS 24.0 Shallow Tree
        if: ${{ inputs.target != 'bootimage' }}
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          
          echo "=== [1/4] Initializing LineageOS 24.0 manifest (blobless, shallow) ==="
          repo init -u https://github.com/LineageOS/android.git \
            -b lineage-24.0 \
            --git-lfs \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:none \
            -g default,-darwin,-mips,-notdefault,-cts,-vts,-tests
          
          echo "=== [2/4] Injecting Xiaomi Zorn local manifest ==="
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/manifests/zorn_a17.xml .repo/local_manifests/
          echo "Active local manifest entries:"
          cat .repo/local_manifests/zorn_a17.xml
          
          echo "=== [3/4] Starting source checkout with live heartbeat monitor ==="
          # Background progress monitor reporting status every 20 seconds
          (
            while true; do
              sleep 20
              REPOS=$(find . -maxdepth 3 -name ".git" 2>/dev/null | wc -l)
              TREE_SIZE=$(du -sh . 2>/dev/null | cut -f1)
              FREE_DISK=$(df -h / | awk 'NR==2 {print $4}')
              echo "[$(date +'%T')] Live Sync: $REPOS repositories checked out | Tree size: $TREE_SIZE | Free disk: $FREE_DISK"
            done
          ) &
          MONITOR_PID=$!
          
          repo sync -c -j4 --no-clone-bundle --no-tags --force-sync --retry-fetches=3
          
          kill $MONITOR_PID 2>/dev/null || true
          
          echo "=== [4/4] Sync complete! Freeing .repo git metadata to maximize build disk space ==="
          du -sh .repo/ || true
          rm -rf .repo
          echo "=== Free space after source sync & .repo eviction ==="
          df -h /

      - name: Overlay Local Device Tree Modifications
        if: ${{ inputs.target != 'bootimage' }}
        run: |
          cd ~/android/lineage
          if [ -d "$GITHUB_WORKSPACE/device/xiaomi/zorn" ]; then
            echo "Applying local device tree modifications..."
            rsync -av --exclude='.git' $GITHUB_WORKSPACE/device/xiaomi/zorn/ device/xiaomi/zorn/
          fi

      - name: Build Target (${{ inputs.target }})
        if: ${{ inputs.target != 'bootimage' }}
        run: |
          cd ~/android/lineage
          export CCACHE_DIR=/tmp/ccache
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export WITHOUT_CHECK_API=true
          
          echo "=== [1/3] Sourcing build environment ==="
          if [ ! -f build/envsetup.sh ]; then
            echo "[ERROR] build/envsetup.sh does not exist in $(pwd)!"
            ls -la
            exit 1
          fi
          source build/envsetup.sh
          
          echo "=== [2/3] Configuring lunch target ==="
          breakfast zorn || lunch lineage_zorn-ap4a-userdebug || lunch lineage_zorn-trunk_staging-userdebug || lunch lineage_zorn-userdebug
          
          mkdir -p $GITHUB_WORKSPACE/artifacts
          
          TARGET="${{ inputs.target }}"
          echo "=== [3/3] Compiling target: $TARGET ==="
          
          if [ "$TARGET" = "sepolicy" ]; then
            m sepolicy
            echo "SELinux policy successfully compiled!"
            touch $GITHUB_WORKSPACE/artifacts/sepolicy_build_success.txt
          elif [ "$TARGET" = "recoveryimage" ]; then
            m recoveryimage
            cp out/target/product/zorn/recovery.img $GITHUB_WORKSPACE/artifacts/ || true
            cp out/target/product/zorn/boot.img $GITHUB_WORKSPACE/artifacts/ || true
            cp out/target/product/zorn/vendor_boot.img $GITHUB_WORKSPACE/artifacts/ || true
            cp out/target/product/zorn/dtbo.img $GITHUB_WORKSPACE/artifacts/ || true
          elif [ "$TARGET" = "rom" ]; then
            m bacon
            cp out/target/product/zorn/lineage-*.zip $GITHUB_WORKSPACE/artifacts/ || true
            cp out/target/product/zorn/recovery.img $GITHUB_WORKSPACE/artifacts/ || true
            cp out/target/product/zorn/boot.img $GITHUB_WORKSPACE/artifacts/ || true
            cp out/target/product/zorn/vendor_boot.img $GITHUB_WORKSPACE/artifacts/ || true
            cp out/target/product/zorn/dtbo.img $GITHUB_WORKSPACE/artifacts/ || true
            cp out/target/product/zorn/super_empty.img $GITHUB_WORKSPACE/artifacts/ || true
          fi
          
          echo "=== Build finished! Generated artifacts: ==="
          ls -lh $GITHUB_WORKSPACE/artifacts/

      - name: Display CCache Stats
        if: always()
        run: |
          export CCACHE_DIR=/tmp/ccache
          ccache -s || true

      - name: Check CCache Content
        if: always()
        id: ccache-check
        run: |
          if [ -d /tmp/ccache ] && [ "$(ls -A /tmp/ccache 2>/dev/null)" ]; then
            echo "has_cache=true" >> $GITHUB_OUTPUT
          else
            echo "has_cache=false" >> $GITHUB_OUTPUT
          fi

      - name: Save CCache (Always saves, even on failure)
        uses: actions/cache/save@v4
        if: always() && steps.ccache-check.outputs.has_cache == 'true'
        with:
          path: /tmp/ccache
          key: ccache-zorn-${{ inputs.target }}-${{ github.run_id }}

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zorn-${{ inputs.target }}-${{ github.run_id }}
          path: artifacts/*
          if-no-files-found: warn

      - name: Publish to GitHub Release
        if: ${{ inputs.upload_release && success() && (inputs.target == 'rom' || inputs.target == 'recoveryimage' || inputs.target == 'bootimage') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zorn-a17-${{ github.run_id }}
          name: LineageOS 24.0 Zorn Flashable Artifacts (Run ${{ github.run_id }})
          body: |
            Automated cloud build for Xiaomi zorn (LineageOS 24.0 / Android 17).
            Target: `${{ inputs.target }}`
            Git Commit: `${{ github.sha }}`
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
